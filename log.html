<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log / Iniciar Sesión - Mi Página Gamer</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

   
    <header>
        <div class="marca">
            <img src="assets/img/engranaje.jpg" alt="Logo" class="logo">
            <h1>Acceso Gamer</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="log.html">Log</a></li>
                <li><a href="info.html">Info</a></li>
            </ul>
        </nav>
    </header>

  
    <main class="contenedor-login">
    <div class="caja-info caja-formulario">
        <h2 class="titulo-seccion" style="text-align: center;">Iniciar Sesión</h2>
        <p class="subtitulo-seccion">Entra con tu cuenta para unirte al clan.</p>
        
        <form action="#" method="POST" class="formulario-gamer">
            <div class="grupo-formulario">
                <label class="etiqueta-formulario">Usuario o Correo:</label>
                <input type="text" placeholder="Tu nick gamer" class="input-gamer">
            </div>
            
            <div class="grupo-formulario">
                <label class="etiqueta-formulario">Contraseña:</label>
                <input type="password" placeholder="••••••••" class="input-gamer">
            </div>

            <button type="submit" class="boton-gamer">
                gracias por unirte
            </button>
        </form>
    </div>
</main>

    <footer>
        <p>Hecho por mí</p>
    </footer>

</body>
</html>
